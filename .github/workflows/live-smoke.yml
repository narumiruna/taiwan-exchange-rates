name: Live provider smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.18.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: smoke
        continue-on-error: true
        run: node scripts/smoke.mjs --output live-smoke-report.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-smoke-report
          path: live-smoke-report.json
          if-no-files-found: error
          retention-days: 14
      - if: steps.smoke.outcome != 'success'
        run: exit 1
