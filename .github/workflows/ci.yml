name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Use the minimum supported runtime
        uses: actions/setup-node@v7
        with:
          node-version: 20.18.1
      - name: Smoke test the built package without development tools
        run: node scripts/package-smoke.mjs

